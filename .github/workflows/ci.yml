name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check servers/

      - name: Type check (mypy)
        run: mypy servers/project-hub-server/tools/ servers/project-hub-server/server.py

      - name: Run smoke tests
        run: pytest tests/smoke/ -v

      - name: Run unit tests
        run: pytest servers/project-hub-server/tests/ -v

  test-windows:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run smoke tests
        run: pytest tests/smoke/ -v

      - name: Run unit tests
        run: pytest servers/project-hub-server/tests/ -v
