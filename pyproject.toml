[project]
license = { file = "LICENSE.md" }

[tool.pytest.ini_options]
testpaths = ["tests", "servers/project-hub-server/tests"]
pythonpath = ["servers/project-hub-server"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# markitdown pulls in pandas -> numpy, whose bundled stub uses Python 3.12+ `type`
# statement syntax — a hard parse error under this project's 3.11 target. We only
# ever call markitdown at runtime (see tools/attachments.py._get_markitdown), so
# skip following it entirely rather than resolving its transitive type stubs.
module = ["markitdown.*", "pandas.*", "numpy.*"]
follow_imports = "skip"
